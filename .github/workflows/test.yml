# Terraform Provider testing workflow.
name: Tests

on:
  pull_request:
    paths-ignore:
      - 'README.md'
  push:
    paths-ignore:
      - 'README.md'

permissions:
  contents: read

jobs:
  # Ensure project builds before running testing matrix
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - run: go mod download
      - run: go build -v .
      - name: Run linters
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest

  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      # We need the latest version of Terraform for our documentation generation to use
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - run: make generate
      - name: git diff
        run: |
          git diff --compact-summary --exit-code || \
            (echo; echo "Unexpected difference in directories after code generation. Run 'make generate' command and commit."; exit 1)

  # Schema snapshots, schema/model consistency and mapping unit tests. These
  # need no backend and no Terraform binary, so they always run.
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - run: go mod download
      - run: make testunit

  # Acceptance tests drive real Terraform against a mesh server in local mode.
  # They need a mesh checkout beside this one, and mesh itself depends on
  # private modules, so the job needs both a token to clone with and a key the
  # go tool can fetch modules with. Without them the tests skip themselves
  # rather than fail, which is what happens on a pull request from a fork.
  acceptance:
    name: Acceptance Tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Write-only attributes need 1.11 or newer.
        terraform:
          - '1.11.*'
          - '1.14.*'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: terraform-provider-partiteai

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        continue-on-error: true
        with:
          app-id: ${{ vars.REPO_ACCESS_APP_ID }}
          private-key: ${{ secrets.REPO_ACCESS_PEM }}
          owner: ${{ github.repository_owner }}

      - name: Check out mesh
        id: mesh
        if: steps.app-token.outcome == 'success'
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: partite-ai/mesh
          path: mesh
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: terraform-provider-partiteai/go.mod
          cache: true
          cache-dependency-path: terraform-provider-partiteai/go.sum

      # mesh depends on private modules. This is the pattern mesh-enterprise
      # builds with: a deploy key in an agent, and git sending github.com over
      # SSH so the go tool can reach every one of them, not just the repository
      # a token was minted for. It comes after the checkouts on purpose — those
      # authenticate over HTTPS.
      - name: Add SSH Go module private key
        if: steps.mesh.outcome == 'success'
        env:
          SSH_AUTH_SOCK: /tmp/ssh_agent.sock
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          ssh-agent -a $SSH_AUTH_SOCK > /dev/null
          ssh-add - <<< "${{ secrets.GO_MODULE_PRIVATE_KEY }}"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> $GITHUB_ENV
          git config --global url."ssh://git@github.com/".insteadOf https://github.com/

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false

      - name: Run acceptance tests
        working-directory: terraform-provider-partiteai
        env:
          PARTITE_MESH_DIR: ${{ github.workspace }}/mesh
          PARTITE_SKIP_MESH_TESTS: ${{ steps.mesh.outcome == 'success' && '' || '1' }}
        run: go test -timeout=30m -parallel=4 ./...

  # The same acceptance tests against mesh-enterprise. That checkout ships the
  # harness that brings its backend up and tears it down again; this job needs
  # Docker, the checkout, and the key its private modules are fetched with.
  enterprise:
    name: Enterprise Acceptance Tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: terraform-provider-partiteai

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        continue-on-error: true
        with:
          app-id: ${{ vars.REPO_ACCESS_APP_ID }}
          private-key: ${{ secrets.REPO_ACCESS_PEM }}
          owner: ${{ github.repository_owner }}

      - name: Check out mesh-enterprise
        id: enterprise
        if: steps.app-token.outcome == 'success'
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: partite-ai/mesh-enterprise
          path: mesh-enterprise
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: terraform-provider-partiteai/go.mod
          cache: true
          cache-dependency-path: terraform-provider-partiteai/go.sum

      - name: Add SSH Go module private key
        if: steps.enterprise.outcome == 'success'
        env:
          SSH_AUTH_SOCK: /tmp/ssh_agent.sock
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          ssh-agent -a $SSH_AUTH_SOCK > /dev/null
          ssh-add - <<< "${{ secrets.GO_MODULE_PRIVATE_KEY }}"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> $GITHUB_ENV
          git config --global url."ssh://git@github.com/".insteadOf https://github.com/

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.14.*'
          terraform_wrapper: false

      - name: Run enterprise acceptance tests
        working-directory: terraform-provider-partiteai
        env:
          PARTITE_TEST_BACKENDS: enterprise
          PARTITE_MESH_ENTERPRISE_DIR: ${{ github.workspace }}/mesh-enterprise
          PARTITE_SKIP_MESH_TESTS: ${{ steps.enterprise.outcome == 'success' && '' || '1' }}
        run: go test -timeout=45m -parallel=4 ./...
