# @genqlient(typename: "LinkDetails")
fragment LinkDetails on Link {
  stableID
  name
  description
  createdAt
  updatedAt
  transfersControl
  fromAgentVersion {
    id
    agent {
      id
    }
  }
  toAgentVersion {
    id
    agent {
      id
    }
  }

  linkResponses {
    name
    description
    messageType
  }
}

query GetMeshLinks($meshId: MeshID!) {
  mesh(id: $meshId) {
    draftVersion {
      # @genqlient(flatten: true)
      links {
        ...LinkDetails
      }
    }
  }
}

mutation CreateLink($meshId: MeshID!, $input: NewLink!) {
  # @genqlient(flatten: true)
  addMeshLink(meshID: $meshId, newLink: $input) {
    ...LinkDetails
  }
}

mutation ModifyLink($stableId: LinkStableID!, $input: UpdateLink!) {
  # @genqlient(flatten: true)
  updateLinkByStableID(stableID: $stableId, input: $input) {
    ...LinkDetails
  }
}

mutation DeleteLink($stableId: LinkStableID!) {
  removeMeshLinkByStableID(stableID: $stableId) {
    id
  }
}

