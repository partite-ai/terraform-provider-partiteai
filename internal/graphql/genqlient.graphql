# @genqlient(typename: "AgentDetails")
fragment AgentDetails on Agent {
  id
  name
  description
  tags
  createdAt
  updatedAt
  latestVersion {
    id
    ordinal
    createdAt
    label
    tags
    identity
    taskInstructions
    modelComplexity
    inputMessageType
    preserveConversationHistory
    sendThinkingToUser
    sendMessagesToUser
    askQuestionsToUser
    mcpConnections {
      mcpConnection {
        id
        name
      }
      filterType
      toolNames
      toolNamePattern
    }
    memorySlots {
      id
      name
      description
      memoryType
      memoryScope
      canRead
      canWrite
      createdAt
    }
  }
}
query GetAgent($id: AgentID!) {
  # @genqlient(flatten: true)
  agent(id: $id) {
    ...AgentDetails
  }
}

mutation CreateAgent($input: NewAgent!) {
  createAgent(input: $input) {
    # @genqlient(flatten: true)
    agent {
      ...AgentDetails
    }
  }
}

mutation ModifyAgent($id: AgentID!, $input: UpdateAgent!) {
  updateAgent(agentID: $id, input: $input) {
    # @genqlient(flatten: true)
    agent {
      ...AgentDetails
    }
  }
}

mutation DeleteAgent($id: AgentID!) {
  deleteAgents(agentIDs: [$id]) {
    ids
  }
}

# @genqlient(typename: "McpConnectionDetails")
fragment McpConnectionDetails on McpConnection {
  id
  name
  transport
  httpTransport {
    url
    authFlow
  }
  stdioTransport {
    command
    arguments
    environment
  }
  createdAt
  updatedAt
}

query GetMcpConnection($id: McpConnectionID!) {
  # @genqlient(flatten: true)
  mcpConnection(id: $id) {
    ...McpConnectionDetails
  }
}

mutation CreateMcpConnection($input: NewMcpConnection!) {
  # @genqlient(flatten: true)
  createMcpConnection(input: $input) {
    ...McpConnectionDetails
  }
}

mutation ModifyMcpConnection(
  $id: McpConnectionID!
  $input: UpdateMcpConnection!
) {
  # @genqlient(flatten: true)
  updateMcpConnection(mcpConnectionID: $id, input: $input) {
    ...McpConnectionDetails
  }
}

mutation DeleteMcpConnection($id: McpConnectionID!) {
  deleteMcpConnections(mcpConnectionIDs: [$id]) {
    ids
  }
}

# @genqlient(typename: "ApiKeyDetails")
fragment ApiKeyDetails on ApiKey {
  id
  name
  description
  kid
  scopes
  createdAt
  updatedAt
}

query GetApiKey($id: ApiKeyID!) {
  # @genqlient(flatten: true)
  apiKey(id: $id) {
    ...ApiKeyDetails
  }
}

mutation CreateApiKey(
  $name: String!
  $description: String
  $scopes: [String!]!
) {
  createApiKey(name: $name, description: $description, scopes: $scopes) {
    # @genqlient(flatten: true)
    apiKey {
      ...ApiKeyDetails
    }
    secret
  }
}

mutation ModifyApiKey(
  $id: ApiKeyID!
  $name: String
  $description: String
  $scopes: [String!]
) {
  # @genqlient(flatten: true)
  updateApiKey(
    id: $id
    name: $name
    description: $description
    scopes: $scopes
  ) {
    ...ApiKeyDetails
  }
}

mutation DeleteApiKey($id: ApiKeyID!) {
  deleteApiKeys(apiKeyIDs: [$id]) {
    ids
  }
}

fragment ModelProviderDetails on ModelProvider {
  id
  name
  description
  providerType
  providerConfig {
    ... on ModelProviderConfigOpenAI {
      apiKey
    }
    ... on ModelProviderConfigOpenAICompatible {
      url
      apiToken
    }
    ... on ModelProviderConfigAnthropic {
      apiKey
    }
    ... on ModelProviderConfigGoogleGenAI {
      gemini {
        apiKey
      }
      vertex {
        serviceAccountKey
        projectID
        location
      }
    }
  }
  tags
  createdAt
  updatedAt
}

query GetModelProvider($id: ModelProviderID!) {
  # @genqlient(flatten: true)
  modelProvider(id: $id) {
    ...ModelProviderDetails
  }
}

mutation CreateModelProvider($input: NewModelProvider!) {
  # @genqlient(flatten: true)
  createModelProvider(input: $input) {
    ...ModelProviderDetails
  }
}

mutation ModifyModelProvider(
  $id: ModelProviderID!
  $input: UpdateModelProvider!
) {
  # @genqlient(flatten: true)
  updateModelProvider(id: $id, input: $input) {
    ...ModelProviderDetails
  }
}

mutation DeleteModelProvider($id: ModelProviderID!) {
  deleteModelProviders(modelProviderIDs: [$id]) {
    ids
  }
}

# @genqlient(typename: "ModelProfileDetails")
fragment ModelProfileDetails on ModelProfile {
  id
  name
  description
  tags
  configuration {
    ... on ModelProfileConfigAnthropic {
      model
      maxTokens
      temperature
      topP
      topK
      thinkingBudgetTokens
    }
    ... on ModelProfileConfigOpenAI {
      model
      maxTokens
      temperature
      topP
      reasoningEffort
    }
    ... on ModelProfileConfigGoogle {
      model
      maxTokens
      temperature
      topP
      topK
      thinkingBudgetTokens
    }
  }
  createdAt
  updatedAt
}

query GetModelProfile($id: ModelProfileID!) {
  # @genqlient(flatten: true)
  modelProfile(id: $id) {
    ...ModelProfileDetails
  }
}

query GetModelProfileByProviderAndName(
