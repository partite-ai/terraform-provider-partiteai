# @genqlient(typename: "RubricDetails")
fragment RubricDetails on Rubric {
  id
  name
  description
  createdAt
  updatedAt
  metrics {
    __typename
    # The two members give their entry id and trial count different types, so
    # each needs an alias of its own.
    ... on RubricUserMetric {
      userEntryID: id
      userMetric {
        id
      }
      userTrialCount: trialCount
      complexity
      inputValues
      weight
    }
    ... on RubricSystemMetric {
      systemEntryID: id
      systemMetric {
        key
      }
      systemTrialCount: trialCount
      complexity
      inputValues
      scoreFloor
      scoreCeiling
      lowerIsBetter
      weight
    }
  }
}

query GetRubric($id: RubricID!) {
  # @genqlient(flatten: true)
  rubric(id: $id) {
    ...RubricDetails
  }
}

mutation CreateRubric($input: NewRubric!) {
  # @genqlient(flatten: true)
  createRubric(input: $input) {
    ...RubricDetails
  }
}

mutation ModifyRubric($id: RubricID!, $input: UpdateRubric!) {
