# @genqlient(typename: "AgentDetails")
fragment AgentDetails on Agent {
  id
  name
  description
  createdAt
  updatedAt
  latestVersion {
    id
    ordinal
    createdAt
    label
    tags
    identity
    taskInstructions
    modelComplexity
    inputMessageType
    sendThinkingToUser
    sendMessagesToUser
    mcpConnections {
      mcpConnection {
        id
        name
      }
      filterType
      toolNames
      toolNamePattern
    }
    tasks {
      taskDefinition {
        id
        name
      }
    }
    memoryInteractionProfiles {
      id
      name
    }
    particles {
      installedParticle {
        id
      }
      filterType
      toolNames
      toolNamePattern
    }
  }
}
query GetAgent($id: AgentID!) {
  # @genqlient(flatten: true)
  agent(id: $id) {
    ...AgentDetails
  }
}

mutation CreateAgent($input: NewAgent!) {
  createAgent(input: $input) {
    # @genqlient(flatten: true)
    agent {
      ...AgentDetails
    }
  }
}

mutation ModifyAgent($id: AgentID!, $input: UpdateAgent!) {
  updateAgent(agentID: $id, input: $input) {
    # @genqlient(flatten: true)
    agent {
      ...AgentDetails
    }
  }
}

mutation DeleteAgent($id: AgentID!) {
  deleteAgents(agentIDs: [$id]) {
    ids
  }
}

