mutation ModifyModelProfile($id: ModelProfileID!, $input: UpdateModelProfile!) {
  # @genqlient(flatten: true)
  updateModelProfile(id: $id, input: $input) {
    ...ModelProfileDetails
  }
}

mutation DeleteModelProfile($id: ModelProfileID!) {
